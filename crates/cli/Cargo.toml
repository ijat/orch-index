[package]
name = "orch-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Build-free structural code index for large git repositories: definitions, callers, references, includers, importers and overrides, with trust labels."

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
oi-git = { version = "0.1.0", path = "../oi-git" }
oi-indexer = { version = "0.1.0", path = "../oi-indexer" }
oi-lang = { version = "0.1.0", path = "../oi-lang" }
oi-model = { version = "0.1.0", path = "../oi-model" }
oi-query = { version = "0.1.0", path = "../oi-query" }
oi-store = { version = "0.1.0", path = "../oi-store" }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
