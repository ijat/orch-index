name: Release

on:
  push:
    tags: ['v*']

# No permissions by default; only the publish job is granted write access.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: check tag matches version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Tag must equal v + workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "orch-index") | .version')
          if [ -z "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "tag '$TAG' does not match crate version '$version' (expected 'v$version')" >&2
            exit 1
          fi
          echo "tag $TAG matches version $version"

  build:
    name: build (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-14
            smoke: false # cross-compiled on an arm64 runner
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            smoke: true
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            smoke: true
            musl: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke: true
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      MUSL: ${{ matrix.musl || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install Rust toolchain and target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Build
        shell: bash
        run: |
          if [ "$MUSL" = "true" ]; then
            # tree-sitter and bundled SQLite are C: compile them with musl's gcc wrapper.
            export CC_x86_64_unknown_linux_musl=musl-gcc CC_aarch64_unknown_linux_musl=musl-gcc
          fi
          cargo build --release --locked --target "$TARGET" -p orch-index
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          exe=""
          case "$TARGET" in *windows*) exe=".exe" ;; esac
          "target/$TARGET/release/orch-index$exe" --version
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="orch-index-${TAG}-${TARGET}"
          mkdir -p "stage/$name" dist
          cp "target/$TARGET/release/orch-index" README.md LICENSE "stage/$name/"
          tar -czf "dist/$name.tar.gz" -C stage "$name"
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "orch-index-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "stage/$name", "dist" | Out-Null
          Copy-Item "target/$env:TARGET/release/orch-index.exe", "README.md", "LICENSE" -Destination "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Check the five archives and write SHA256SUMS
        working-directory: dist
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl \
              aarch64-unknown-linux-musl; do
            test -f "orch-index-${TAG}-${target}.tar.gz" || { echo "missing archive for $target" >&2; exit 1; }
          done
          test -f "orch-index-${TAG}-x86_64-pc-windows-msvc.zip" \
            || { echo "missing archive for x86_64-pc-windows-msvc" >&2; exit 1; }
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create GitHub Release
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag dist/*
